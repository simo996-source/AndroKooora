<!DOCTYPE html>

    <title>أحدث الأخبار | أندرو كورة</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">

    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="shortcut icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="assets/style.css">

<body>

    <header class="scoreboard">

            <div class="search-wrap">

        <nav class="scoreboard-nav">
            <a href="index.html" id="nav-home">الرئيسية</a>

                    <div class="chip-list" id="news-categories-list"></div>

                <div class="widget">

                    <ul class="mini-list" id="news-latest-list"></ul>
                </div>
            </aside>

    <footer class="site-footer">
        © 2026 أندرو كورة — جميع الحقوق محفوظة
